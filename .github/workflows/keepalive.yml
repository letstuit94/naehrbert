# Hält das Render-Free-Backend wach, damit die Demo keinen ~50 s Kaltstart
# hat (Render Free schläft nach 15 Min Inaktivität ein).
#
# Kostenlose Alternative zu cron-job.org — nutzt die GitHub Actions, die das
# Repo ohnehin schon verwendet, kein weiterer Drittanbieter nötig.
#
# Setup: Repo → Settings → Secrets and variables → Actions → New secret
#        Name  = BACKEND_HEALTH_URL
#        Value = https://<dein-service>.onrender.com/health
#
# Bekannte Einschränkungen des GitHub-Cron (bewusst in Kauf genommen):
#  - Der Zeitplan ist "best effort": bei GitHub-Last kann er ein paar Minuten
#    verspätet feuern (die 15-Min-Grenze von Render verzeiht das).
#  - GitHub deaktiviert geplante Workflows automatisch nach 60 Tagen ohne
#    Repo-Aktivität. Für ein aktives Bootcamp-Projekt kein Problem.
name: keepalive

on:
  # Ping pausiert: Zeitplan auskommentiert, damit das Backend NICHT rund um
  # die Uhr wachgehalten wird (spart Render-Instanzstunden). Zum Reaktivieren
  # einfach die beiden schedule-Zeilen wieder einkommentieren.
  # schedule:
  #   - cron: "*/12 * * * *" # alle 12 Min < Renders 15-Min-Schlafgrenze
  workflow_dispatch: {} # bleibt: manuelles Auslösen (Actions-Tab) weiter möglich

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::warning::BACKEND_HEALTH_URL nicht gesetzt – Ping übersprungen."
            exit 0
          fi
          curl --fail --show-error --silent \
               --retry 3 --retry-delay 20 --max-time 90 \
               "$HEALTH_URL"
