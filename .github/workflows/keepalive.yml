# Keeps the Render free-tier backend awake so the demo doesn't suffer a ~50 s
# cold start (Render Free goes to sleep after 15 min of inactivity).
#
# Free alternative — uses the GitHub Actions the repo already relies on,
# no additional third-party service required.
#
# Setup: Repo → Settings → Secrets and variables → Actions → New secret
#        Name  = BACKEND_HEALTH_URL
#        Value = https://<your-service>.onrender.com/health
#
# Known limitations of GitHub cron (deliberately accepted):
#  - The schedule is "best effort": under GitHub load it may fire a few minutes
#    late (Render's 15-min limit tolerates that).
#  - GitHub automatically disables scheduled workflows after 60 days without
#    repo activity. Not an issue for an active bootcamp project.
name: keepalive

on:
  schedule:
    - cron: "*/12 * * * *" # every 12 min < Render's 15-min sleep threshold
  workflow_dispatch: {} # stays: manual triggering (Actions tab) remains possible

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::warning::BACKEND_HEALTH_URL not set – ping skipped."
            exit 0
          fi
          curl --fail --show-error --silent \
               --retry 3 --retry-delay 20 --max-time 90 \
               "$HEALTH_URL"
