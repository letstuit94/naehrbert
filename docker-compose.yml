# Local dev: backend + frontend only. No local Postgres container — the
# backend talks directly to the (already-provisioned) Supabase project via
# SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY in .env, per
# instructions/clean_rebuild_migration_guide.md's "new Supabase project,
# service-role key, no local DB" decision.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./BLS_data:/app/BLS_data

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
