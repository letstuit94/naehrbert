<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 605" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="605" fill="#fcfcfb"/>

  <!-- Title / subtitle -->
  <text x="40" y="42" font-size="25" font-weight="700" fill="#0b0b0b">Human review still catches what automated matching misses</text>
  <text x="40" y="68" font-size="14.5" fill="#52514e">119 extracted receipt items, each checked against three automated matching methods</text>

  <!-- Legend -->
  <circle cx="45" cy="92" r="5.5" fill="#0ca30c"/>
  <text x="57" y="96" font-size="13" font-weight="600" fill="#52514e">Matched automatically</text>
  <circle cx="245" cy="92" r="5.5" fill="#ec835a"/>
  <text x="257" y="96" font-size="13" font-weight="600" fill="#52514e">No automated match — needs human review</text>

  <!-- Gridlines -->
  <text x="510" y="112" font-size="11.5" text-anchor="middle" fill="#898781" font-variant-numeric="tabular-nums">25%</text>
  <text x="720" y="112" font-size="11.5" text-anchor="middle" fill="#898781" font-variant-numeric="tabular-nums">50%</text>
  <text x="930" y="112" font-size="11.5" text-anchor="middle" fill="#898781" font-variant-numeric="tabular-nums">75%</text>
  <text x="1140" y="112" font-size="11.5" text-anchor="middle" fill="#898781" font-variant-numeric="tabular-nums">100%</text>
  <line x1="510" y1="120" x2="510" y2="418" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="720" y1="120" x2="720" y2="418" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="930" y1="120" x2="930" y2="418" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="1140" y1="120" x2="1140" y2="418" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Row: All extracted items (baseline) -->
  <text x="280" y="151" font-size="15" font-weight="700" text-anchor="end" fill="#0b0b0b">All extracted items</text>
  <rect x="300" y="128" width="840" height="36" rx="6" fill="#c3c2b7"/>
  <text x="720" y="151" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">119 items extracted · 100%</text>

  <!-- Row: OFF -->
  <text x="280" y="211" font-size="14.5" font-weight="600" text-anchor="end" fill="#52514e">OpenFoodFacts (OFF)</text>
  <rect x="300" y="190" width="294.5" height="32" rx="6" fill="#0ca30c"/>
  <text x="447.2" y="211" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">42 good · 35%</text>
  <rect x="598.5" y="190" width="541.5" height="32" rx="6" fill="#ec835a"/>
  <text x="869.2" y="211" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">77 unmatched · 65%</text>

  <!-- Row: BLS -->
  <text x="280" y="265" font-size="14.5" font-weight="600" text-anchor="end" fill="#52514e">German BLS database</text>
  <rect x="300" y="244" width="280.4" height="32" rx="6" fill="#0ca30c"/>
  <text x="440.2" y="265" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">40 good · 34%</text>
  <rect x="584.4" y="244" width="555.6" height="32" rx="6" fill="#ec835a"/>
  <text x="862.2" y="265" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">79 unmatched · 66%</text>

  <!-- Row: Fallback -->
  <text x="280" y="319" font-size="14.5" font-weight="600" text-anchor="end" fill="#52514e">Category fallback</text>
  <rect x="300" y="298" width="343.9" height="32" rx="6" fill="#0ca30c"/>
  <text x="471.9" y="319" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">49 good · 41%</text>
  <rect x="647.9" y="298" width="492.1" height="32" rx="6" fill="#ec835a"/>
  <text x="893.9" y="319" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">70 unmatched · 59%</text>

  <!-- Divider + eyebrow -->
  <line x1="40" y1="340" x2="1160" y2="340" stroke="#e1e0d9" stroke-width="1"/>
  <text x="300" y="360" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#898781">COMBINED — UNION OF ALL THREE METHODS</text>

  <!-- Row: Combined -->
  <text x="280" y="403" font-size="16" font-weight="700" text-anchor="end" fill="#0b0b0b">Any method matched</text>
  <rect x="300" y="378" width="605.1" height="40" rx="7" fill="#0ca30c"/>
  <text x="602.5" y="403" font-size="14.5" font-weight="700" text-anchor="middle" fill="#ffffff">86 matched by at least one method · 72%</text>
  <rect x="909.1" y="378" width="230.9" height="40" rx="7" fill="#ec835a" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="1024.5" y="403" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">33 items · 28%</text>

  <!-- Callout -->
  <line x1="1024.5" y1="418" x2="1024.5" y2="446" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="1024.5" y="466" font-size="15.5" font-weight="700" text-anchor="middle" fill="#0b0b0b">33 items (28%) matched by nothing</text>
  <text x="1024.5" y="486" font-size="13" text-anchor="middle" fill="#52514e">no automated method worked — a human has to fix these</text>

  <!-- Footer -->
  <line x1="40" y1="524" x2="1160" y2="524" stroke="#e1e0d9" stroke-width="1"/>
  <text x="40" y="546" font-size="11.5" fill="#898781">Source: receipt_extraction_items.csv — n = 119 extracted items, human-verified good/bad per matching method</text>
  <text x="40" y="564" font-size="11.5" fill="#898781">BLS = German food composition database · OFF = OpenFoodFacts · Fallback = category-level heuristic match</text>
</svg>
