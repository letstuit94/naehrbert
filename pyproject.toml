[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI's File()/Depends() default-arg pattern is idiomatic, not a bug

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
